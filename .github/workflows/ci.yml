name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  php-lint:
    name: PHP lint & composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # PHP 8.5 = versi yang dipakai prod (SistemLogistik) & lockfile
          # (commit b2378e5 "upgrade php 8.5"); dev deps (symfony 8.1,
          # doctrine/instantiator 2.1) butuh PHP >= 8.4 — CI 8.2 tidak valid.
          php-version: '8.5'
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-interaction

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint PHP files (php -l)
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      # F24-4: the unit suite (SQLite, zero-provision — RBAC schema is
      # recreated per test by DbTestCase) used to be green on every wave
      # commit but was never executed here, so regressions could slip through.
      - name: Run unit tests (Codeception, SQLite)
        run: vendor/bin/codecept run -c tests/codeception.yml unit
